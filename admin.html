<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>校園出缺席管理｜行政端</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6ff;color:#25324b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.header{background:#6f84df;color:#fff;padding:24px 18px 28px}.header h1{margin:0;font-size:30px}
.wrap{max-width:1000px;margin:-10px auto 40px;padding:0 14px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(50,70,120,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:800;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #dfe4f0;border-radius:12px;background:#fff;color:#25324b}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{padding:12px 16px;border-radius:12px;font-weight:800}.blue{background:#6f84df;color:#fff}.gray{background:#edf0f6;color:#53617d}
.notice{margin-top:14px;background:#f3f5fd;border-radius:14px;padding:13px;color:#596783;line-height:1.55}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f6f8fc;border:1px solid #e2e6ef;border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}
.tablewrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 7px;border-bottom:1px solid #e4e8f0;text-align:left;white-space:nowrap}th{background:#f5f7fb}.empty{padding:20px;text-align:center;color:#77829a}
@media(max-width:620px){.grid{grid-template-columns:1fr}.header h1{font-size:27px}}
</style></head><body>
<header class="header"><h1>校園出缺席管理</h1></header><main class="wrap"><div class="card">
<h2 style="margin-top:0">🧑‍💼 行政端</h2>
<div id="loginBox"><div class="notice">請輸入行政端密碼。</div>
<input id="adminPassword" type="password" placeholder="行政端密碼" style="margin-top:12px">
<div class="actions"><button id="loginBtn" class="btn blue">登入</button></div><div id="loginError" style="color:#c34b56;margin-top:8px"></div></div>
<div id="adminContent" class="hidden">
<div class="grid"><div><label>統計日期</label><input id="adminDate" type="date"></div><div><label>班級</label><select id="adminClass"><option value="">全校</option></select></div></div>
<div class="actions"><button id="refreshBtn" class="btn blue">重新整理</button><button id="csvBtn" class="btn gray">匯出 CSV</button><button id="logoutBtn" class="btn gray">登出行政端</button></div>
<div id="message" class="notice">正在準備…</div>
<div class="stats"><div class="stat">學生總數<b id="statTotal">0</b></div><div class="stat">出席<b id="statPresent">0</b></div><div class="stat">請假<b id="statLeave">0</b></div></div>
<h3>各班統計</h3><div id="classStats" class="tablewrap"></div><h3>請假名單</h3><div id="leaveTable" class="tablewrap"></div>
</div></div></main>
<script>
const LIFF_ID="2011500404-mlhsA2fA"; const CLOUD_API_URL="https://script.google.com/macros/s/AKfycbzlJJ3CC9VW0EmOnszeR6tcGzp3QGxNpbG4t_XXaLC1PRg8vb2abe7Zxr0K6_fhH_H9/exec"; const FIXED_CLASS="二甲"; const R={"一甲": ["梅淨林", "陳翊", "黃恩泉", "蔡士宗", "徐浚愷", "洪祟祐", "張景文", "江昀芝", "王秝家", "周婉琦", "莊毓儒"], "二甲": ["高瑞翌", "鄭垚庠", "洪宥昇", "盧成風", "余守豐", "張晨恩", "方星棠", "許嘉恩", "許郁欣", "黃茹渝", "陳欣", "汪萭霏", "歐柔安", "徐柔安"], "三甲": ["張惟歆", "楊承宥", "徐浚晏", "蕭妤晅", "黃毓沁", "王婕庭", "洪苡恩", "劉以軍", "張芸菲", "張鉦坪"], "四甲": ["黃予安", "洪翊軒", "王俊堡", "盧廷州", "洪翌程", "張詠恩", "吳虹翾", "謝媃崴", "洪欣瑜", "吳宥瑩", "余昕庭", "黃姿穎"], "五甲": ["謝恩典", "謝侑廷", "張恆睿", "江柏佑", "陳永木", "余亭叡", "許瑋庭", "江旻瑾", "蕭妡紜", "張羽希", "吳芃蓁", "張蕎音", "林文彬", "陳明賢"], "六甲": ["黃琮益", "黃琮傑", "黃裕宬", "高芳慈", "劉貝倪", "沈柏逸", "鄭明源", "廖文皓", "陳芃崴", "洪立芹", "江旻珆", "余菀庭", "余芷嫻", "余昀芯"]}; const EXPECTED={"一甲":11,"二甲":14,"三甲":10,"四甲":12,"五甲":14,"六甲":14}; const KEY="schoolAttendanceRecords_v7"; const ADMIN_PASSWORD="sdes6320902";
const R={"一甲": ["梅淨林", "陳翊", "黃恩泉", "蔡士宗", "徐浚愷", "洪祟祐", "張景文", "江昀芝", "王秝家", "周婉琦", "莊毓儒"], "二甲": ["高瑞翌", "鄭垚庠", "洪宥昇", "盧成風", "余守豐", "張晨恩", "方星棠", "許嘉恩", "許郁欣", "黃茹渝", "陳欣", "汪萭霏", "歐柔安", "徐柔安"], "三甲": ["張惟歆", "楊承宥", "徐浚晏", "蕭妤晅", "黃毓沁", "王婕庭", "洪苡恩", "劉以軍", "張芸菲", "張鉦坪"], "四甲": ["黃予安", "洪翊軒", "王俊堡", "盧廷州", "洪翌程", "張詠恩", "吳虹翾", "謝媃崴", "洪欣瑜", "吳宥瑩", "余昕庭", "黃姿穎"], "五甲": ["謝恩典", "謝侑廷", "張恆睿", "江柏佑", "陳永木", "余亭叡", "許瑋庭", "江旻瑾", "蕭妡紜", "張羽希", "吳芃蓁", "張蕎音", "林文彬", "陳明賢"], "六甲": ["黃琮益", "黃琮傑", "黃裕宬", "高芳慈", "劉貝倪", "沈柏逸", "鄭明源", "廖文皓", "陳芃崴", "洪立芹", "江旻珆", "余菀庭", "余芷嫻", "余昀芯"]}; const EXPECTED={"一甲":11,"二甲":14,"三甲":10,"四甲":12,"五甲":14,"六甲":14};
let cloudCache=[],adminLoggedIn=false;
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function loadCloud(){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);window[cb]=x=>{delete window[cb];s.remove();resolve(Array.isArray(x?.records)?x.records:[])};const s=document.createElement("script");s.src=CLOUD_API_URL+"?action=records&callback="+cb;s.onerror=()=>{delete window[cb];s.remove();reject(new Error("read failed"))};document.body.append(s);setTimeout(()=>{if(window[cb]){delete window[cb];s.remove();reject(new Error("timeout"))}},12000)})}
async function renderAdmin(){const d=$("adminDate").value,c=$("adminClass").value;$("message").textContent="☁️ 正在讀取雲端資料…";try{cloudCache=await loadCloud();const f=cloudCache.filter(r=>(!d||r.date===d)&&(!c||r.class===c));const latest={};f.forEach(r=>latest[r.date+"|"+r.class+"|"+r.name]=r);const rows=Object.values(latest),classes=c?[c]:Object.keys(R);$("statTotal").textContent=classes.reduce((n,x)=>n+R[x].length,0);$("statPresent").textContent=rows.filter(r=>r.status==="present").length;$("statLeave").textContent=rows.filter(r=>r.status==="leave").length;let t="<table><tr><th>班級</th><th>學生數</th><th>出席</th><th>請假</th></tr>";classes.forEach(x=>{const rr=rows.filter(r=>r.class===x);t+="<tr><td>"+x+"</td><td>"+R[x].length+"</td><td>"+rr.filter(r=>r.status==="present").length+"</td><td>"+rr.filter(r=>r.status==="leave").length+"</td></tr>"});$("classStats").innerHTML=t+"</table>";const leaves=rows.filter(r=>r.status==="leave");$("leaveTable").innerHTML=leaves.length?"<table><tr><th>日期</th><th>班級</th><th>學生</th><th>假別</th><th>請假日期</th><th>備註</th></tr>"+leaves.map(r=>"<tr><td>"+esc(r.date)+"</td><td>"+esc(r.class)+"</td><td>"+esc(r.name)+"</td><td>"+esc(r.leaveType)+"</td><td>"+esc(r.leaveDate)+"</td><td>"+esc(r.note)+"</td></tr>").join("")+"</table>":"<div class='empty'>目前沒有請假資料。</div>";$("message").textContent="雲端資料更新完成。"}catch(e){console.error(e);$("message").textContent="雲端資料讀取失敗，請確認 Apps Script 部署。";$("classStats").innerHTML="<div class='empty'>無法讀取資料。</div>";$("leaveTable").innerHTML=""}}
function login(){if($("adminPassword").value===ADMIN_PASSWORD){adminLoggedIn=true;$("loginBox").classList.add("hidden");$("adminContent").classList.remove("hidden");$("loginError").textContent="";renderAdmin()}else $("loginError").textContent="密碼錯誤。"}
function logout(){adminLoggedIn=false;$("adminContent").classList.add("hidden");$("loginBox").classList.remove("hidden");$("adminPassword").value=""}
function csv(){const d=$("adminDate").value,c=$("adminClass").value,rows=cloudCache.filter(r=>(!d||r.date===d)&&(!c||r.class===c));const head=["日期","班級","學生姓名","狀態","假別","請假日期","備註"];const out=[head,...rows.map(r=>[r.date,r.class,r.name,r.status==="present"?"出席":"請假",r.leaveType,r.leaveDate,r.note])].map(a=>a.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");const blob=new Blob(["\ufeff"+out],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="校園出缺席_"+(d||"全部日期")+".csv";a.click()}
function init(){$("adminDate").value=today();Object.keys(R).forEach(c=>$("adminClass").append(new Option(c,c)));$("loginBtn").onclick=login;$("logoutBtn").onclick=logout;$("refreshBtn").onclick=renderAdmin;$("csvBtn").onclick=csv;$("adminDate").onchange=()=>{if(adminLoggedIn)renderAdmin()};$("adminClass").onchange=()=>{if(adminLoggedIn)renderAdmin()};$("adminPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()})}init();
</script></body></html>
