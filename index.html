<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>校園出缺席管理系統</title><style>
:root{
  --primary:#6b7fd7; --primary2:#8b9be6; --bg:#f5f7ff;
  --card:#fff; --text:#26324a; --muted:#718096;
  --green:#43b581; --red:#ef6b73; --orange:#f3a64a;

}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}

.btn{padding:11px 14px;border-radius:10px;font-weight:700}
.btn-primary{background:var(--primary);color:white}
.btn-green{background:var(--green);color:white}
.btn-orange{background:var(--orange);color:white}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.student-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.student{border:1px solid var(--border);border-radius:12px;padding:11px;background:#fff}
.student.present{border-color:#9bd8bd;background:#f0fbf5}
.student.leave{border-color:#f4c988;background:#fff8ed}
.student-name{font-weight:800;margin-bottom:8px}
.status{font-size:13px;color:var(--muted);margin-bottom:8px;min-height:19px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:15px;border-radius:14px;background:#f7f8fc;border:1px solid var(--border)}
.stat b{display:block;font-size:25px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left}
th{background:#f7f8fc}
.table-wrap{overflow:auto}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:10px;background:#f4f6ff;color:#59647f;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,27,45,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-box{background:white;border-radius:18px;padding:20px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h2{margin-top:0}
.line-user{font-size:13px;opacity:.9;margin-top:5px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.badge-present{background:#dff6e9;color:#277a52}
.badge-absent{background:#ffe1e4;color:#a73d46}
.badge-leave{background:#ffedcc;color:#95621b}
.empty{padding:25px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:#8790a5;font-size:12px;padding:15px}

body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.tab{cursor:pointer} .hidden{display:none!important}
.student{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #eee}
.small-actions{display:flex;gap:6px} .status{min-width:110px}
@media(max-width:650px){.student{flex-wrap:wrap} .status{order:3;width:100%}}
</style></head>
<body>
<header class="header"><div class="header-inner">
<h1>🏫 校園出缺席管理系統</h1><p>教師點名・請假紀錄・行政統計</p>
<div id="lineUser" style="display:none"></div>
<div style="margin-top:10px;font-size:13px">
<a href="https://liff.line.me/2011500404-mIhsA2fA" style="color:inherit">📝 老師點名</a>　
<a href="https://liff.line.me/2011500404-mIhsA2fA?mode=admin" style="color:inherit">📊 行政查詢</a>
</div>
</div></header>
<main class="container">
<div class="card">
<div class="tabs">
<button id="teacherTab" class="tab active" onclick="showTeacher()">👩‍🏫 教師點名</button>

<section id="teacherPanel">

<div><label>班級</label><select id="class"></select></div>
</div>

<button class="btn btn-gray" onclick="clearCurrentMarks()">↺ 清除本次點名</button>
<button class="btn btn-primary" onclick="saveCurrent()">💾 儲存本次點名</button>
</div>

<div id="leaveCard" class="card hidden" style="margin-top:16px;background:#fffaf1">

<div><label>學生</label><select id="leaveStudent"></select></div>

</div></div>
</section>

<section id="adminPanel" class="hidden">
<div id="adminLogin">
<h3>🔐 行政端登入</h3><p class="notice">請輸入行政端密碼。</p>
<input id="adminPassword" type="password" placeholder="輸入密碼">
<div class="actions"><button class="btn btn-primary" onclick="loginAdmin()">登入行政端</button></div>
<p id="loginError" style="color:#c24b55"></p>
</div>
<div id="adminContent" class="hidden">
<div class="grid">
<div><label>統計日期</label><input id="adminDate" type="date" onchange="renderAdmin()"></div>
<div><label>班級篩選</label><select id="adminClass" onchange="renderAdmin()"><option value="">全校</option></select></div>
</div>
<div class="actions"><button class="btn btn-primary" onclick="renderAdmin()">重新整理</button>
<button class="btn btn-gray" onclick="exportCSV()">匯出 CSV</button></div>
<div class="stats" style="margin-top:16px">
<div class="stat">學生總數<b id="statTotal">0</b></div>
<div class="stat">出席<b id="statPresent">0</b></div>
<div class="stat">請假<b id="statLeave">0</b></div>
</div>
<h3>📊 各班統計</h3><div id="classStats" class="table-wrap"></div>
<h3>📋 請假名單</h3><div id="leaveTable" class="table-wrap"></div>
<div class="actions"><button class="btn btn-red" onclick="logoutAdmin()">登出行政端</button>
<button class="btn btn-gray" onclick="clearAllData()">清除本機全部資料</button></div>
<p class="notice">注意：已接上 Google Sheets 雲端儲存；本機仍會保留一份資料作為備份。</p>
</div></section>
</div>
<div class="footer">校園出缺席管理系統｜教師端與行政端</div>
</main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID="2011500404-mlhsA2fA";
const R={"一甲": ["梅淨林", "陳翊", "黃恩泉", "蔡士宗", "徐浚愷", "洪祟祐", "張景文", "江昀芝", "王秝家", "周婉琦", "莊毓儒"], "二甲": ["高瑞翌", "鄭垚庠", "洪宥昇", "盧成風", "余守豐", "張晨恩", "方星棠", "許嘉恩", "許郁欣", "黃茹渝", "陳欣", "汪萭霏", "歐柔安", "徐柔安"], "三甲": ["張惟歆", "楊承宥", "徐浚晏", "蕭妤晅", "黃毓沁", "王婕庭", "洪苡恩", "劉以軍", "張芸菲", "張鉦坪"], "四甲": ["黃予安", "洪翊軒", "王俊堡", "盧廷州", "洪翌程", "張詠恩", "吳虹翾", "謝媃崴", "洪欣瑜", "吳宥瑩", "余昕庭", "黃姿穎"], "五甲": ["謝恩典", "謝侑廷", "張恆睿", "江柏佑", "陳永木", "余亭叡", "許瑋庭", "江旻瑾", "蕭妡紜", "張羽希", "吳芃蓁", "張蕎音", "林文彬", "陳明賢"], "六甲": ["黃琮益", "黃琮傑", "黃裕宬", "高芳慈", "劉貝倪", "沈柏逸", "鄭明源", "廖文皓", "陳芃崴", "洪立芹", "江旻珆", "余菀庭", "余芷嫻", "余昀芯"]};
const EXPECTED_COUNTS={"一甲":11,"二甲":14,"三甲":10,"四甲":12,"五甲":14,"六甲":14};
function validateRoster(){
  const problems=[];
  Object.keys(EXPECTED_COUNTS).forEach(c=>{
    const actual=(R[c]||[]).length;
    if(actual!==EXPECTED_COUNTS[c]) problems.push(c+"：應有"+EXPECTED_COUNTS[c]+"人，實際"+actual+"人");
  });
  return problems;
}
const KEY="schoolAttendanceRecords_v5";
const CLOUD_API_URL="https://script.google.com/macros/s/AKfycbz-kxYza7hP9z4eLzZIRxCYN4FCjsQeLnmyof1NhWSbiNnV3i2zexjZWHilN96HvSr3/exec";
const ADMIN_PASSWORD="sdes6320902";
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentMarks={};
let adminLoggedIn=false;
const dateEl=document.getElementById("date");
const classEl=document.getElementById("class");
const classTitleEl=document.getElementById("classTitle");
const studentListEl=document.getElementById("studentList");
const leaveCardEl=document.getElementById("leaveCard");
const leaveStudentEl=document.getElementById("leaveStudent");
const leaveDateEl=document.getElementById("leaveDate");
const leaveTypeEl=document.getElementById("leaveType");
const leaveNoteEl=document.getElementById("leaveNote");
const adminDateEl=document.getElementById("adminDate");
const adminClassEl=document.getElementById("adminClass");
const teacherPanelEl=document.getElementById("teacherPanel");
const adminPanelEl=document.getElementById("adminPanel");
const teacherTabEl=document.getElementById("teacherTab");
const adminTabEl=document.getElementById("adminTab");
const adminPasswordEl=document.getElementById("adminPassword");
const adminLoginEl=document.getElementById("adminLogin");
const adminContentEl=document.getElementById("adminContent");
const loginErrorEl=document.getElementById("loginError");
const statTotalEl=document.getElementById("statTotal");
const statPresentEl=document.getElementById("statPresent");
const statLeaveEl=document.getElementById("statLeave");
const classStatsEl=document.getElementById("classStats");
const leaveTableEl=document.getElementById("leaveTable");

function pad(n){return String(n).padStart(2,"0")}
function today(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function saveRecords(){localStorage.setItem(KEY,JSON.stringify(records))}
function showTeacher(){teacherPanelEl.classList.remove("hidden");adminPanelEl.classList.add("hidden");teacherTabEl.classList.add("active");adminTabEl.classList.remove("active")}
function openAdmin(){teacherPanelEl.classList.add("hidden");adminPanelEl.classList.remove("hidden");teacherTabEl.classList.remove("active");adminTabEl.classList.add("active");if(adminLoggedIn)renderAdmin()}
function applyStartMode(){
  const params=new URLSearchParams(window.location.search);
  const hash=(window.location.hash||"").replace(/^#/,"").toLowerCase();
  const mode=(params.get("mode")||hash||"").toLowerCase();
  if(mode==="admin") openAdmin();
  else showTeacher();
}
function loginAdmin(){if(adminPasswordEl.value===ADMIN_PASSWORD){adminLoggedIn=true;document.getElementById("adminLogin").classList.add("hidden");document.getElementById("adminContent").classList.remove("hidden");loginErrorEl.textContent="";renderAdmin()}else loginErrorEl.textContent="密碼錯誤，請重新輸入。"}
function logoutAdmin(){adminLoggedIn=false;adminContentEl.classList.add("hidden");adminLoginEl.classList.remove("hidden");adminPasswordEl.value=""}
function populateClasses(){classEl.innerHTML="";adminClassEl.innerHTML='<option value="">全校</option>';Object.keys(R).forEach(x=>{classEl.add(new Option(x,x));adminClassEl.add(new Option(x,x))});classEl.value=Object.keys(R)[0]}
function getC(){return classEl.value}
function getD(){return dateEl.value}
function renderLeaveSelect(){const s=leaveStudentEl;s.innerHTML="";(R[getC()]||[]).forEach(n=>s.add(new Option(n,n)))}
function renderStudents(){const c=getC();classTitleEl.textContent=c+"｜學生名單（"+(R[c]||[]).length+"人）";studentListEl.innerHTML="";(R[c]||[]).forEach(name=>{const m=currentMarks[name];const div=document.createElement("div");div.className="student";const nm=document.createElement("div");nm.className="student-name";nm.textContent=name;const st=document.createElement("div");st.className="status";st.textContent=m?.status==="present"?"✓ 出席":m?.status==="leave"?("請假｜"+(m.leaveType||"")+(m.note?"｜"+m.note:"")):"尚未點名";const ac=document.createElement("div");ac.className="small-actions";const b1=document.createElement("button");b1.className="btn btn-green";b1.textContent="到";b1.onclick=()=>setMark(name,"present");const b2=document.createElement("button");b2.className="btn btn-orange";b2.textContent="假";b2.onclick=()=>openLeave(name);ac.append(b1,b2);div.append(nm,st,ac);studentListEl.appendChild(div)})}
function setMark(name,status){currentMarks[name]={status};renderStudents()}
function markWholePresent(){
  const c=getC();
  if(!c)return alert("請先選擇班級");
  const roster=R[c]||[];
  if(roster.length!==EXPECTED_COUNTS[c]) return alert(c+"名單人數異常，請先修正學生名單。\n應有："+EXPECTED_COUNTS[c]+" 人\n目前："+roster.length+" 人");
  currentMarks={};
  roster.forEach(n=>currentMarks[n]={status:"present"});
  renderStudents();
  alert(c+" 全班到已完成標記：共 "+Object.keys(currentMarks).length+" 人。\n請確認後按「儲存本次點名」。");
}
function clearCurrentMarks(){currentMarks={};renderStudents()}
function openLeave(name){leaveCardEl.classList.remove("hidden");leaveStudentEl.value=name;leaveDateEl.value=getD();leaveTypeEl.value="事假";leaveNoteEl.value="";leaveCardEl.scrollIntoView({behavior:"smooth"})}
function closeLeave(){leaveCardEl.classList.add("hidden")}
function saveLeave(){const name=leaveStudentEl.value,d=leaveDateEl.value,c=getC();if(!name||!d||!c)return alert("請填寫班級、學生與請假日期");currentMarks[name]={status:"leave",leaveType:leaveTypeEl.value,leaveDate:d,note:leaveNoteEl.value.trim()};closeLeave();renderStudents()}
async function sendToCloud(record){
  try{
    await fetch(CLOUD_API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({date:record.date,className:record.class,studentName:record.name,status:record.status,leaveType:record.leaveType||"",note:record.note||""})});
    return true;
  }catch(err){
    console.error("雲端同步失敗",err);
    return false;
  }
}
async function saveCurrent(){
  const c=getC(),d=getD();
  if(!c||!d)return alert("請先選擇日期與班級");
  const roster=R[c]||[];
  const problems=validateRoster();
  if(problems.length) return alert("學生名單有異常，無法儲存：\n"+problems.join("\n"));

  const missing=roster.filter(name=>!currentMarks[name]);
  if(missing.length){
    return alert(c+" 尚有 "+missing.length+" 位學生沒有點名：\n"+missing.join("、")+"\n\n請先按「全班到」或逐位登記。");
  }

  const newRecords=roster.map(name=>{
    const m=currentMarks[name];
    return {id:Date.now()+"_"+Math.random().toString(36).slice(2),date:d,class:c,name,status:m.status,leaveType:m.leaveType||"",leaveDate:m.leaveDate||"",note:m.note||"",createdAt:new Date().toISOString()};
  });

  records.push(...newRecords);
  saveRecords();

  // 逐筆同步，避免同時送出大量 POST 導致 Google Apps Script 漏收資料。
  let ok=0;
  for(const record of newRecords){
    if(await sendToCloud(record)) ok++;
  }

  // 再從雲端讀回來驗證本次班級實際收到幾筆。
  let cloudCount=null;
  // Apps Script 寫入完成可能比 POST 回應稍晚，最多重試 3 次再判定是否真的少資料。
  for(let attempt=0;attempt<3;attempt++){
    try{
      await new Promise(r=>setTimeout(r,1500));
      const cloud=await loadCloudRecords();
      const latest={};
      cloud.filter(r=>r.date===d&&r.class===c).forEach(r=>latest[r.name]=r);
      cloudCount=Object.keys(latest).length;
      if(cloudCount===roster.length) break;
    }catch(err){
      console.warn("儲存後雲端驗證失敗",err);
    }
  }

  currentMarks={};
  renderStudents();

  if(cloudCount===roster.length){
    alert(c+" 點名完成！\n\n學生總數："+roster.length+" 人\n出席／請假資料："+cloudCount+" 筆\n\n✅ 已確認 Google Sheets 雲端資料完整。");
  }else if(cloudCount!==null){
    alert(c+" 本機已儲存 "+newRecords.length+" 人，但雲端目前讀到 "+cloudCount+" 人。\n\n請不要重複按儲存，先檢查 Google Sheets。\n本次送出成功的網路請求："+ok+" / "+newRecords.length);
  }else if(ok===newRecords.length){
    alert(c+" 已儲存 "+newRecords.length+" 人，雲端送出完成，但暫時無法回讀驗證。\n請稍後確認 Google Sheets。");
  }else{
    alert(c+" 本機已儲存 "+newRecords.length+" 人，但雲端送出只有 "+ok+" / "+newRecords.length+" 筆。\n請檢查網路或 Apps Script。");
  }
}
function loadCurrent(){currentMarks={};const c=getC(),d=getD();records.filter(r=>r.date===d&&r.class===c).forEach(r=>currentMarks[r.name]={status:r.status,leaveType:r.leaveType,leaveDate:r.leaveDate,note:r.note||""});renderStudents()}
async function renderAdmin(){if(!adminLoggedIn)return;
  const d=adminDateEl.value,c=adminClassEl.value;
  classStatsEl.innerHTML='<div class="empty">☁️ 正在讀取雲端資料...</div>';
  leaveTableEl.innerHTML='';
  try{
    const data=await loadCloudRecords();
    let filtered=data.filter(r=>(!d||r.date===d)&&(!c||r.class===c));
    const latest={};
    filtered.forEach(r=>latest[`${r.date}|${r.class}|${r.name}`]=r);
    const rows=Object.values(latest);
    const cs=c?[c]:Object.keys(R);
    statTotalEl.textContent=cs.reduce((n,x)=>n+R[x].length,0);
    statPresentEl.textContent=rows.filter(r=>r.status==="present").length;
    statLeaveEl.textContent=rows.filter(r=>r.status==="leave").length;
let t="<table><tr><th>班級</th><th>學生數</th><th>出席</th><th>請假</th></tr>";cs.forEach(x=>{const rr=rows.filter(r=>r.class===x);t+=`<tr><td>${x}</td><td>${R[x].length}</td><td>${rr.filter(r=>r.status==="present").length}</td><td>${rr.filter(r=>r.status==="leave").length}</td></tr>`});classStatsEl.innerHTML=t+"</table>";
const leaves=rows.filter(r=>r.status==="leave");if(!leaves.length)leaveTableEl.innerHTML="<div class='empty'>目前沒有請假紀錄。</div>";else{let q="<table><tr><th>日期</th><th>班級</th><th>學生</th><th>假別</th><th>備註</th></tr>";leaves.sort((a,b)=>(a.class+a.name).localeCompare(b.class+b.name));leaves.forEach(r=>q+=`<tr><td>${r.leaveDate||r.date}</td><td>${r.class}</td><td>${r.name}</td><td>${r.leaveType||""}</td><td>${r.note||"—"}</td></tr>`);leaveTableEl.innerHTML=q+"</table>"}
  }catch(err){
    console.error(err);
    classStatsEl.innerHTML='<div class="empty">⚠️ 無法讀取雲端資料，請確認 Apps Script 已更新並重新部署。</div>';
  }
}
function loadCloudRecords(){
  return new Promise((resolve,reject)=>{
    const callback='cloudCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('雲端讀取逾時'));},10000);
    window[callback]=(payload)=>{cleanup(); if(payload&&payload.success) resolve(payload.records||[]); else reject(new Error(payload&&payload.message||'雲端讀取失敗'));};
    function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
    script.onerror=()=>{cleanup();reject(new Error('無法連線到 Apps Script'));};
    script.src=CLOUD_API_URL+'?action=records&callback='+encodeURIComponent(callback);
    document.body.appendChild(script);
  });
}
async function exportCSV(){
  const d=adminDateEl.value,c=adminClassEl.value;
  let data=[];
  try{ data=await loadCloudRecords(); }catch(err){ data=records; }
  data=data.filter(r=>(!d||r.date===d)&&(!c||r.class===c));
  const latest={};
  data.forEach(r=>latest[`${r.date}|${r.class}|${r.name}`]=r);
  data=Object.values(latest);
  if(!data.length)return alert("沒有可匯出的資料");
  const lines=[["日期","班級","學生","狀態","假別","請假日期","備註"],...data.map(r=>[r.date,r.class,r.name,r.status==="present"?"出席":"請假",r.leaveType||"",r.leaveDate||"",r.note||""])];
  const csv="\uFEFF"+lines.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`出缺席_${d||"全部"}.csv`;
  a.click();
}
