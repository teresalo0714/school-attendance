<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>校園出缺席管理系統</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#f3f7fb;
  color:#243447;
}

button,
select,
textarea,
input{
  font:inherit;
}

.app{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.header{
  background:white;
  border-radius:22px;
  padding:18px 20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.title{
  font-size:24px;
  font-weight:800;
}

.date{
  color:#718096;
  font-size:13px;
  margin-top:5px;
}

.liff-status{
  font-size:12px;
  color:#94a3b8;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.class-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:15px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.green{
  background:#16a34a;
  color:white;
}

.blue{
  background:#3b82f6;
  color:white;
}

.gray{
  background:#e9eef5;
  color:#243447;
}

.red{
  background:#ef4444;
  color:white;
}

.purple{
  background:#7c3aed;
  color:white;
}

.student{
  background:#fff;
  border:1px solid #edf1f5;
  border-radius:17px;
  padding:13px;
  margin-bottom:10px;
}

.student-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.number{
  width:32px;
  font-weight:800;
  color:#718096;
}

.name{
  flex:1;
  font-size:17px;
  font-weight:700;
}

.status{
  font-size:12px;
  padding:5px 8px;
  border-radius:9px;
  background:#e8f5e9;
  color:#198754;
  white-space:nowrap;
}

.status.absent{
  background:#fff0f0;
  color:#d63031;
}

.details{
  display:none;
  margin-top:12px;
  margin-left:42px;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.details.show{
  display:grid;
}

select,
textarea,
input{
  width:100%;
  border:1px solid #d8e0ea;
  border-radius:10px;
  padding:10px;
  background:white;
}

textarea{
  grid-column:1/-1;
  min-height:60px;
  resize:vertical;
}

.message{
  text-align:center;
  padding:25px 10px;
  color:#718096;
  line-height:1.7;
}

.error{
  background:#fff0f0;
  color:#c0392b;
  padding:15px;
  border-radius:12px;
  line-height:1.8;
}

.save-status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#718096;
  line-height:1.6;
}


/* =========================
   行政端入口
========================= */

.admin-entry{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid #e8edf3;
  text-align:center;
}

.admin-entry button{
  width:100%;
  max-width:400px;
}


/* =========================
   登入畫面
========================= */

.login-box{
  max-width:430px;
  margin:20px auto;
}

.login-icon{
  font-size:50px;
  text-align:center;
  margin-bottom:10px;
}

.login-title{
  font-size:24px;
  font-weight:800;
  text-align:center;
  margin-bottom:8px;
}

.login-text{
  color:#718096;
  text-align:center;
  font-size:14px;
  margin-bottom:20px;
}

.password-box{
  margin-bottom:10px;
}

.login-error{
  color:#dc2626;
  font-size:14px;
  text-align:center;
  margin-top:12px;
}


/* =========================
   行政端
========================= */

.admin-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.admin-title{
  font-size:24px;
  font-weight:800;
}

.section-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:13px;
}

.section-subtitle{
  color:#718096;
  font-size:13px;
  margin-top:-7px;
  margin-bottom:15px;
}


/* =========================
   六班點名狀況
========================= */

.class-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.class-status-card{
  border:1px solid #e7edf3;
  border-radius:16px;
  padding:14px;
  background:#fafcff;
}

.class-status-card.completed{
  background:#f0fdf4;
  border-color:#bbf7d0;
}

.class-status-card.incomplete{
  background:#fff7ed;
  border-color:#fed7aa;
}

.class-status-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:7px;
}

.class-status-label{
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.completed-text{
  color:#15803d;
}

.incomplete-text{
  color:#c2410c;
}

.class-numbers{
  font-size:13px;
  line-height:1.7;
  color:#475569;
}


/* =========================
   全校統計
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat-card{
  padding:15px 8px;
  border-radius:15px;
  background:#f8fafc;
  text-align:center;
  border:1px solid #edf1f5;
}

.stat-number{
  font-size:26px;
  font-weight:900;
}

.stat-label{
  font-size:13px;
  color:#718096;
  margin-top:4px;
}


/* =========================
   今日請假名單
========================= */

.absence-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.absence-item{
  border:1px solid #e7edf3;
  border-radius:15px;
  padding:13px;
  display:grid;
  grid-template-columns:70px 55px 1fr 75px 1.5fr;
  gap:8px;
  align-items:center;
}

.absence-class{
  font-weight:800;
}

.absence-seat{
  color:#64748b;
  font-size:14px;
}

.absence-name{
  font-weight:800;
}

.leave-badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  text-align:center;
}

.leave-sick{
  background:#fee2e2;
  color:#b91c1c;
}

.leave-personal{
  background:#ffedd5;
  color:#c2410c;
}

.leave-bereavement{
  background:#ede9fe;
  color:#6d28d9;
}

.leave-other{
  background:#e2e8f0;
  color:#475569;
}

.absence-note{
  color:#475569;
  font-size:14px;
}

.no-absence{
  background:#f0fdf4;
  color:#15803d;
  padding:20px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
}


/* =========================
   載入
========================= */

.loading{
  text-align:center;
  padding:35px 10px;
  color:#718096;
}


/* =========================
   手機版
========================= */

@media(max-width:700px){

  .app{
    padding:10px;
  }

  .title{
    font-size:21px;
  }

  .class-title{
    font-size:20px;
  }

  .name{
    font-size:16px;
  }

  .details.show{
    grid-template-columns:1fr;
  }

  .details{
    margin-left:0;
  }

  .toolbar .btn{
    flex:1;
  }

  .class-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .absence-item{
    grid-template-columns:55px 45px 1fr 65px;
  }

  .absence-note{
    grid-column:1/-1;
    background:#f8fafc;
    padding:8px;
    border-radius:8px;
  }

  .admin-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .admin-header .btn{
    width:100%;
  }

}

</style>
</head>


<body>

<div class="app">

  <div class="header">

    <div class="title">
      🏫 校園出缺席管理
    </div>

    <div class="date" id="today"></div>

    <div class="liff-status" id="liffStatus">
      正在連接 LINE...
    </div>

  </div>


  <!-- 班級點名頁 -->
  <div id="attendancePage">

    <div class="card">

      <div class="class-title" id="classTitle">
        正在讀取班級...
      </div>


      <div class="toolbar">

        <button
          class="btn green"
          id="checkAllButton"
          onclick="checkAll()"
          disabled>
          ✓ 一鍵全班簽到
        </button>

        <button
          class="btn blue"
          id="saveButton"
          onclick="saveAttendance()"
          disabled>
          💾 儲存今日出缺席
        </button>

        <button
          class="btn gray"
          id="reloadButton"
          onclick="loadStudents()"
          disabled>
          ↻ 重新整理
        </button>

      </div>


      <div id="students">

        <div class="message">
          正在啟動 LINE 點名系統...
        </div>

      </div>


      <div
        id="saveStatus"
        class="save-status">
      </div>


      <!-- 行政端入口 -->
      <div class="admin-entry">

        <button
          class="btn purple"
          onclick="openAdminLogin()">
          🔐 進入行政端
        </button>

      </div>

    </div>

  </div>


  <!-- 行政登入頁 -->
  <div
    id="adminLoginPage"
    style="display:none;">

    <div class="card login-box">

      <div class="login-icon">
        🔐
      </div>

      <div class="login-title">
        行政管理登入
      </div>

      <div class="login-text">
        請輸入行政端密碼
      </div>

      <div class="password-box">

        <input
          type="password"
          id="adminPassword"
          placeholder="行政端密碼"
          autocomplete="off"
          onkeydown="adminPasswordKeydown(event)">

      </div>

      <button
        class="btn purple"
        id="adminLoginButton"
        style="width:100%;"
        onclick="adminLogin()">
        登入行政端
      </button>

      <button
        class="btn gray"
        style="width:100%;margin-top:8px;"
        onclick="backToAttendance()">
        ← 返回點名
      </button>

      <div
        id="loginError"
        class="login-error">
      </div>

    </div>

  </div>


  <!-- 行政端首頁 -->
  <div
    id="adminPage"
    style="display:none;">

    <div class="admin-header">

      <div>

        <div class="admin-title">
          📊 行政管理
        </div>

        <div
          class="date"
          id="adminDate">
        </div>

      </div>

      <button
        class="btn gray"
        onclick="logoutAdmin()">
        ← 返回班級點名
      </button>

    </div>


    <div id="adminContent">

      <div class="card">

        <div class="loading">
          正在讀取全校今日點名資料...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* ==================================================
   設定
================================================== */

const CONFIG = {

  LIFF_ID:
    '2011500404-mIhsA2fA',

  API_URL:
    'https://script.google.com/macros/s/AKfycbyn4EvzGapAd2XyPIVhVgi8q4E-y38qlb0YrkcyALWbVanOgHKTW_h70Ws9DG7BIbQ/exec'

};


const CLASSES = [
  '一甲',
  '二甲',
  '三甲',
  '四甲',
  '五甲',
  '六甲'
];


let currentClass = '';

let studentData = [];

let adminPassword = '';


/* ==================================================
   日期
================================================== */

document.getElementById('today').textContent =
  new Date().toLocaleDateString(
    'zh-TW',
    {
      year:'numeric',
      month:'long',
      day:'numeric'
    }
  );


/* ==================================================
   系統啟動
================================================== */

async function startApp(){

  const status =
    document.getElementById('liffStatus');


  try{

    await liff.init({
      liffId:CONFIG.LIFF_ID
    });


    status.textContent =
      liff.isInClient()
        ? 'LINE 內開啟'
        : '瀏覽器模式';


    currentClass =
      getClassFromURL();


    if(!currentClass){

      currentClass =
        getClassFromLiffState();

    }


    if(!currentClass){

      showNoClass();
      return;

    }


    document.getElementById(
      'classTitle'
    ).textContent =
      currentClass +
      '｜今日點名';


    enableButtons();

    await loadStudents();


  }catch(error){

    console.error(
      'LIFF 初始化錯誤：',
      error
    );


    status.textContent =
      'LINE 初始化失敗';


    currentClass =
      getClassFromURL();


    if(currentClass){

      document.getElementById(
        'classTitle'
      ).textContent =
        currentClass +
        '｜今日點名';

      enableButtons();

      await loadStudents();

      return;

    }


    document.getElementById(
      'classTitle'
    ).textContent =
      '無法啟動系統';


    document.getElementById(
      'students'
    ).innerHTML = `

      <div class="error">

        ❌ LINE LIFF 初始化失敗。

        <br><br>

        ${escapeHTML(
          error.message || error
        )}

      </div>

    `;

  }

}


/* ==================================================
   讀取 class
================================================== */

function getClassFromURL(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );


    const className =
      String(
        params.get('class') || ''
      ).trim();


    if(
      CLASSES.includes(className)
    ){

      return className;

    }

  }catch(error){

    console.error(error);

  }

  return '';

}


/* ==================================================
   從 liff.state 讀取 class
================================================== */

function getClassFromLiffState(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );


    const state =
      params.get('liff.state');


    if(!state){

      return '';

    }


    let decodedState = state;


    try{

      decodedState =
        decodeURIComponent(state);

    }catch(e){}


    const questionIndex =
      decodedState.indexOf('?');


    if(questionIndex === -1){

      return '';

    }


    const queryString =
      decodedState.substring(
        questionIndex + 1
      );


    const stateParams =
      new URLSearchParams(
        queryString
      );


    const className =
      String(
        stateParams.get('class') || ''
      ).trim();


    if(
      CLASSES.includes(className)
    ){

      return className;

    }

  }catch(error){

    console.error(error);

  }

  return '';

}


/* ==================================================
   找不到班級
================================================== */

function showNoClass(){

  document.getElementById(
    'classTitle'
  ).textContent =
    '找不到班級';


  document.getElementById(
    'students'
  ).innerHTML = `

    <div class="error">

      ⚠️ 這個 LINE 連結沒有帶入班級資料。

      <br><br>

      請從 LINE 官方帳號的一甲～六甲按鈕進入。

    </div>

  `;

}


/* ==================================================
   按鈕
================================================== */

function enableButtons(){

  document.getElementById(
    'checkAllButton'
  ).disabled = false;

  document.getElementById(
    'saveButton'
  ).disabled = false;

  document.getElementById(
    'reloadButton'
  ).disabled = false;

}


/* ==================================================
   JSONP API
================================================== */

function api(action,params={}){

  return new Promise(
    (resolve,reject)=>{


      const callbackName =
        'attendanceCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random()*100000
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );

      query.set(
        'callback',
        callbackName
      );


      Object.keys(params).forEach(
        key=>{

          if(
            params[key] !== undefined &&
            params[key] !== null
          ){

            query.set(
              key,
              String(params[key])
            );

          }

        }
      );


      let finished=false;


      const timer =
        setTimeout(
          ()=>{

            if(finished)return;

            finished=true;

            cleanup();

            reject(
              new Error(
                'Apps Script 連線逾時'
              )
            );

          },
          20000
        );


      function cleanup(){

        clearTimeout(timer);

        if(script.parentNode){

          script.parentNode.removeChild(
            script
          );

        }

        try{

          delete window[
            callbackName
          ];

        }catch(e){}

      }


      window[
        callbackName
      ] = function(data){

        if(finished)return;

        finished=true;

        cleanup();


        if(
          data &&
          data.ok === false
        ){

          reject(
            new Error(
              data.error ||
              'API 發生錯誤'
            )
          );

          return;

        }


        resolve(data);

      };


      script.onerror =
        function(){

          if(finished)return;

          finished=true;

          cleanup();

          reject(
            new Error(
              '無法連線到 Apps Script'
            )
          );

        };


      script.src =
        CONFIG.API_URL +
        '?' +
        query.toString();


      document.body.appendChild(
        script
      );

    }
  );

}


/* ==================================================
   讀取學生
================================================== */

async function loadStudents(){

  if(!currentClass){

    showNoClass();
    return;

  }


  const box =
    document.getElementById(
      'students'
    );


  box.innerHTML = `

    <div class="message">

      正在讀取
      ${escapeHTML(currentClass)}
      學生名單...

    </div>

  `;


  try{

    studentData =
      await api(
        'getStudents',
        {
          className:currentClass
        }
      );


    renderStudents();


  }catch(error){

    box.innerHTML = `

      <div class="error">

        ❌ 無法取得學生名單

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ==================================================
   顯示學生
================================================== */

function renderStudents(){

  const box =
    document.getElementById(
      'students'
    );


  if(
    !Array.isArray(studentData) ||
    studentData.length === 0
  ){

    box.innerHTML = `

      <div class="message">

        ${escapeHTML(currentClass)}
        目前沒有學生資料。

      </div>

    `;

    return;

  }


  box.innerHTML='';


  studentData.forEach(
    (student,index)=>{


      const div =
        document.createElement(
          'div'
        );


      div.className='student';


      div.innerHTML = `

        <div class="student-row">

          <div class="number">
            ${escapeHTML(student.number)}
          </div>

          <div class="name">
            ${escapeHTML(student.name)}
          </div>

          <div
            class="status"
            id="status-${index}">
            出席
          </div>

          <button
            class="btn gray"
            onclick="toggleDetails(${index})">
            假別／備註
          </button>

        </div>


        <div
          class="details"
          id="details-${index}">

          <select
            id="leave-${index}"
            onchange="leaveChanged(${index})">

            <option value="">
              出席
            </option>

            <option value="事假">
              事假
            </option>

            <option value="病假">
              病假
            </option>

            <option value="喪假">
              喪假
            </option>

          </select>


          <button
            class="btn gray"
            onclick="setPresent(${index})">
            恢復出席
          </button>


          <textarea
            id="note-${index}"
            placeholder="備註（可留白）"></textarea>

        </div>

      `;


      box.appendChild(div);

    }
  );

}


/* ==================================================
   假別
================================================== */

function toggleDetails(index){

  const element =
    document.getElementById(
      'details-' + index
    );

  if(element){

    element.classList.toggle(
      'show'
    );

  }

}


function leaveChanged(index){

  const leave =
    document.getElementById(
      'leave-' + index
    ).value;


  const status =
    document.getElementById(
      'status-' + index
    );


  if(leave){

    status.textContent='缺席';

    status.className=
      'status absent';

  }else{

    setPresent(index);

  }

}


function setPresent(index){

  const select =
    document.getElementById(
      'leave-' + index
    );

  if(select){

    select.value='';

  }


  const status =
    document.getElementById(
      'status-' + index
    );

  if(status){

    status.textContent='出席';

    status.className='status';

  }

}


/* ==================================================
   全班簽到
================================================== */

function checkAll(){

  if(!studentData.length)return;


  studentData.forEach(
    (student,index)=>{

      setPresent(index);

    }
  );


  document.getElementById(
    'saveStatus'
  ).textContent =
    '✓ 已將全班設定為出席，記得按「儲存今日出缺席」。';

}


/* ==================================================
   儲存點名
================================================== */

async function saveAttendance(){

  if(
    !currentClass ||
    !studentData.length
  ){

    alert(
      '目前沒有可以儲存的學生資料。'
    );

    return;

  }


  const button =
    document.getElementById(
      'saveButton'
    );


  const statusBox =
    document.getElementById(
      'saveStatus'
    );


  const records =
    studentData.map(
      (student,index)=>{


        const leave =
          document.getElementById(
            'leave-' + index
          ).value;


        const note =
          document.getElementById(
            'note-' + index
          ).value.trim();


        return{

          number:student.number,

          name:student.name,

          status:
            leave
              ? '缺席'
              : '出席',

          leaveType:leave,

          note:note

        };

      }
    );


  button.disabled=true;

  button.textContent=
    '儲存中...';


  statusBox.textContent=
    '正在儲存點名資料...';


  try{

    const result =
      await api(
        'saveAttendance',
        {
          className:currentClass,
          records:
            JSON.stringify(records)
        }
      );


    statusBox.textContent =
      '✅ ' +
      result.className +
      ' 今日點名完成，共 ' +
      result.count +
      ' 人。';


    alert(
      result.className +
      ' 今日點名完成！'
    );


  }catch(error){

    statusBox.textContent=
      '❌ 儲存失敗';

    alert(
      '儲存失敗：' +
      error.message
    );

  }finally{

    button.disabled=false;

    button.textContent=
      '💾 儲存今日出缺席';

  }

}


/* ==================================================
   開啟行政登入
================================================== */

function openAdminLogin(){

  document.getElementById(
    'attendancePage'
  ).style.display='none';


  document.getElementById(
    'adminPage'
  ).style.display='none';


  document.getElementById(
    'adminLoginPage'
  ).style.display='block';


  document.getElementById(
    'adminPassword'
  ).value='';


  document.getElementById(
    'loginError'
  ).textContent='';


  setTimeout(
    ()=>{

      document.getElementById(
        'adminPassword'
      ).focus();

    },
    100
  );

}


/* ==================================================
   密碼 Enter
================================================== */

function adminPasswordKeydown(event){

  if(event.key === 'Enter'){

    adminLogin();

  }

}


/* ==================================================
   行政登入
================================================== */

async function adminLogin(){

  const password =
    document.getElementById(
      'adminPassword'
    ).value;


  const errorBox =
    document.getElementById(
      'loginError'
    );


  const button =
    document.getElementById(
      'adminLoginButton'
    );


  if(!password){

    errorBox.textContent =
      '請輸入行政端密碼';

    return;

  }


  errorBox.textContent='';

  button.disabled=true;

  button.textContent=
    '驗證中...';


  try{

    const result =
      await api(
        'verifyAdmin',
        {
          password:password
        }
      );


    if(!result.valid){

      errorBox.textContent =
        '❌ 密碼錯誤';

      return;

    }


    adminPassword=password;


    document.getElementById(
      'adminLoginPage'
    ).style.display='none';


    document.getElementById(
      'adminPage'
    ).style.display='block';


    await loadAdminData();


  }catch(error){

    errorBox.textContent =
      '❌ 無法登入：' +
      error.message;

  }finally{

    button.disabled=false;

    button.textContent=
      '登入行政端';

  }

}


/* ==================================================
   讀取行政資料
================================================== */

async function loadAdminData(){

  const content =
    document.getElementById(
      'adminContent'
    );


  content.innerHTML = `

    <div class="card">

      <div class="loading">
        正在讀取全校今日點名資料...
      </div>

    </div>

  `;


  try{

    const data =
      await api(
        'getTodayAdminData',
        {
          password:adminPassword
        }
      );


    renderAdmin(data);


  }catch(error){

    content.innerHTML = `

      <div class="card">

        <div class="error">

          ❌ 無法讀取行政資料

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      </div>

    `;

  }

}


/* ==================================================
   顯示行政端
================================================== */

function renderAdmin(data){

  document.getElementById(
    'adminDate'
  ).textContent =
    '今日：' +
    escapeHTML(data.date);


  const classes =
    Array.isArray(data.classes)
      ? data.classes
      : [];


  const school =
    data.school || {};


  /* ===============================================
     ① 六個班級點名狀況
  =============================================== */

  let classHTML='';


  classes.forEach(
    info=>{


      const completed =
        info.completed === true;


      classHTML += `

        <div class="
          class-status-card
          ${completed
            ? 'completed'
            : 'incomplete'}
        ">

          <div class="class-status-name">

            ${escapeHTML(
              info.className
            )}

          </div>


          <div class="
            class-status-label
            ${completed
              ? 'completed-text'
              : 'incomplete-text'}
          ">

            ${
              completed
                ? '✅ 已完成點名'
                : '⚠️ 尚未完成'
            }

          </div>


          <div class="class-numbers">

            全班：
            ${Number(info.total || 0)}
            人

            <br>

            已點：
            ${Number(info.recorded || 0)}
            人

            <br>

            出席：
            ${Number(info.present || 0)}
            人

            <br>

            請假：
            ${Number(info.absent || 0)}
            人

          </div>

        </div>

      `;

    }
  );


  /* ===============================================
     ② 全校請假名單
  =============================================== */

  let absentees=[];


  classes.forEach(
    info=>{

      const list =
        Array.isArray(info.absentees)
          ? info.absentees
          : [];


      list.forEach(
        student=>{

          absentees.push({

            className:
              info.className,

            number:
              student.number,

            name:
              student.name,

            leaveType:
              student.leaveType,

            note:
              student.note

          });

        }
      );

    }
  );


  let absenceHTML='';


  if(absentees.length === 0){

    absenceHTML = `

      <div class="no-absence">

        🎉 今天目前沒有請假學生

      </div>

    `;

  }else{


    absentees.forEach(
      student=>{


        const leaveClass =
          getLeaveClass(
            student.leaveType
          );


        absenceHTML += `

          <div class="absence-item">


            <div class="absence-class">

              ${escapeHTML(
                student.className
              )}

            </div>


            <div class="absence-seat">

              ${escapeHTML(
                student.number
              )}號

            </div>


            <div class="absence-name">

              ${escapeHTML(
                student.name
              )}

            </div>


            <div>

              <span class="
                leave-badge
                ${leaveClass}
              ">

                ${escapeHTML(
                  student.leaveType ||
                  '請假'
                )}

              </span>

            </div>


            <div class="absence-note">

              ${
                student.note
                  ? '備註：' +
                    escapeHTML(
                      student.note
                    )
                  : '備註：—'
              }

            </div>


          </div>

        `;

      }
    );

  }


  /* ===============================================
     完整行政畫面
  =============================================== */

  document.getElementById(
    'adminContent'
  ).innerHTML = `


    <!-- 第一區：六班狀況 -->

    <div class="card">

      <div class="section-title">

        🏫 今日各班點名狀況

      </div>

      <div class="section-subtitle">

        可以直接確認六個班級是否完成今日點名

      </div>


      <div class="class-grid">

        ${classHTML}

      </div>

    </div>


    <!-- 第二區：全校統計 -->

    <div class="card">

      <div class="section-title">

        📊 今日全校統計

      </div>


      <div class="stats-grid">


        <div class="stat-card">

          <div class="stat-number">

            ${Number(
              school.completedClasses || 0
            )}
            /
            ${Number(
              school.totalClasses || 6
            )}

          </div>

          <div class="stat-label">
            已完成班級
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-number">

            ${Number(
              school.total || 0
            )}

          </div>

          <div class="stat-label">
            全校學生
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-number">

            ${Number(
              school.present || 0
            )}

          </div>

          <div class="stat-label">
            今日出席
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-number">

            ${Number(
              school.absent || 0
            )}

          </div>

          <div class="stat-label">
            今日請假
          </div>

        </div>


      </div>

    </div>


    <!-- 第三區：全校請假名單 -->

    <div class="card">

      <div class="section-title">

        📋 今日請假名單
        （${absentees.length} 人）

      </div>

      <div class="section-subtitle">

        六個班級的請假學生統一顯示在這裡

      </div>


      <div class="absence-list">

        ${absenceHTML}

      </div>

    </div>


    <div style="
      text-align:center;
      margin-bottom:25px;
    ">

      <button
        class="btn blue"
        onclick="loadAdminData()">

        ↻ 更新今日資料

      </button>

    </div>

  `;

}


/* ==================================================
   假別顏色
================================================== */

function getLeaveClass(type){

  if(type === '病假'){

    return 'leave-sick';

  }

  if(type === '事假'){

    return 'leave-personal';

  }

  if(type === '喪假'){

    return 'leave-bereavement';

  }

  return 'leave-other';

}


/* ==================================================
   返回點名
================================================== */

function backToAttendance(){

  document.getElementById(
    'adminLoginPage'
  ).style.display='none';


  document.getElementById(
    'adminPage'
  ).style.display='none';


  document.getElementById(
    'attendancePage'
  ).style.display='block';

}


/* ==================================================
   登出行政端
================================================== */

function logoutAdmin(){

  adminPassword='';


  document.getElementById(
    'adminPassword'
  ).value='';


  backToAttendance();

}


/* ==================================================
   HTML 安全
================================================== */

function escapeHTML(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    char=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char])
  );

}


/* ==================================================
   啟動
================================================== */

startApp();

</script>
