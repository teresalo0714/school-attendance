<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>校園出缺席管理系統</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#f3f7fb;
  color:#243447;
}

button,
select,
textarea{
  font:inherit;
}

.app{
  max-width:850px;
  margin:auto;
  padding:16px;
}

.header{
  background:white;
  border-radius:22px;
  padding:18px 20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.title{
  font-size:24px;
  font-weight:800;
}

.date{
  color:#718096;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:20px;
  padding:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.class-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:15px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.green{
  background:#16a34a;
  color:white;
}

.blue{
  background:#3b82f6;
  color:white;
}

.gray{
  background:#e9eef5;
  color:#243447;
}

.student{
  background:#fff;
  border:1px solid #edf1f5;
  border-radius:17px;
  padding:13px;
  margin-bottom:10px;
}

.student-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.number{
  width:32px;
  font-weight:800;
  color:#718096;
}

.name{
  flex:1;
  font-size:17px;
  font-weight:700;
}

.status{
  font-size:12px;
  padding:5px 8px;
  border-radius:9px;
  background:#e8f5e9;
  color:#198754;
  white-space:nowrap;
}

.status.absent{
  background:#fff0f0;
  color:#d63031;
}

.details{
  display:none;
  margin-top:12px;
  margin-left:42px;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.details.show{
  display:grid;
}

select,
textarea{
  width:100%;
  border:1px solid #d8e0ea;
  border-radius:10px;
  padding:10px;
  background:white;
}

textarea{
  grid-column:1/-1;
  min-height:60px;
  resize:vertical;
}

.message{
  text-align:center;
  padding:25px 10px;
  color:#718096;
  line-height:1.7;
}

.error{
  background:#fff0f0;
  color:#c0392b;
  padding:15px;
  border-radius:12px;
  line-height:1.8;
}

.save-status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#718096;
  line-height:1.6;
}

.liff-status{
  font-size:12px;
  color:#94a3b8;
  margin-top:5px;
}

@media(max-width:600px){

  .app{
    padding:10px;
  }

  .title{
    font-size:21px;
  }

  .class-title{
    font-size:20px;
  }

  .name{
    font-size:16px;
  }

  .details.show{
    grid-template-columns:1fr;
  }

  .details{
    margin-left:0;
  }

  .toolbar .btn{
    flex:1;
  }

}

</style>
</head>


<body>

<div class="app">

  <div class="header">

    <div class="title">
      🏫 校園出缺席管理
    </div>

    <div class="date" id="today"></div>

    <div class="liff-status" id="liffStatus">
      正在連接 LINE...
    </div>

  </div>


  <div class="card">

    <div class="class-title" id="classTitle">
      正在讀取班級...
    </div>


    <div class="toolbar">

      <button
        class="btn green"
        id="checkAllButton"
        onclick="checkAll()"
        disabled
      >
        ✓ 一鍵全班簽到
      </button>


      <button
        class="btn blue"
        id="saveButton"
        onclick="saveAttendance()"
        disabled
      >
        💾 儲存今日出缺席
      </button>


      <button
        class="btn gray"
        id="reloadButton"
        onclick="loadStudents()"
        disabled
      >
        ↻ 重新整理
      </button>

    </div>


    <div id="students">

      <div class="message">
        正在啟動 LINE 點名系統...
      </div>

    </div>


    <div
      id="saveStatus"
      class="save-status">
    </div>

  </div>

</div>


<script>

/* ==================================================
   基本設定
================================================== */

const CONFIG = {

  LIFF_ID:
    '2011500404-mIhsA2fA',

  API_URL:
    'https://script.google.com/macros/s/AKfycbyn4EvzGapAd2XyPIVhVgi8q4E-y38qlb0YrkcyALWbVanOgHKTW_h70Ws9DG7BIbQ/exec'

};


const CLASSES = [
  '一甲',
  '二甲',
  '三甲',
  '四甲',
  '五甲',
  '六甲'
];


let currentClass = '';

let studentData = [];



/* ==================================================
   日期
================================================== */

document.getElementById('today').textContent =
  new Date().toLocaleDateString(
    'zh-TW',
    {
      year:'numeric',
      month:'long',
      day:'numeric'
    }
  );



/* ==================================================
   系統啟動
================================================== */

async function startApp(){

  const status =
    document.getElementById(
      'liffStatus'
    );


  try{

    /*
     * ★ 最重要的地方
     *
     * 必須先完成 LIFF 初始化。
     * LIFF 有可能在這個過程進行 redirect。
     */

    await liff.init({
      liffId: CONFIG.LIFF_ID
    });


    status.textContent =
      liff.isInClient()
        ? 'LINE 內開啟'
        : '瀏覽器模式';


    /*
     * LIFF 初始化完成後，
     * 才開始判斷班級。
     */

    currentClass =
      getClassFromURL();


    /*
     * 找不到一般 ?class 時，
     * 再嘗試從 liff.state 取得。
     */

    if(!currentClass){

      currentClass =
        getClassFromLiffState();

    }


    if(!currentClass){

      showNoClass();

      return;

    }


    document.getElementById(
      'classTitle'
    ).textContent =
      currentClass +
      '｜今日點名';


    enableButtons();


    await loadStudents();


  }catch(error){

    console.error(
      'LIFF 初始化錯誤：',
      error
    );


    status.textContent =
      'LINE 初始化失敗';


    /*
     * 即使 LIFF 初始化失敗，
     * 若網址本身已有 class，
     * 仍嘗試讓網頁正常工作。
     */

    currentClass =
      getClassFromURL();


    if(currentClass){

      document.getElementById(
        'classTitle'
      ).textContent =
        currentClass +
        '｜今日點名';


      enableButtons();


      await loadStudents();

      return;

    }


    document.getElementById(
      'classTitle'
    ).textContent =
      '無法啟動系統';


    document.getElementById(
      'students'
    ).innerHTML = `

      <div class="error">

        ❌ LINE LIFF 初始化失敗。

        <br><br>

        ${escapeHTML(
          error.message || error
        )}

      </div>

    `;

  }

}



/* ==================================================
   從目前網址取得 class
================================================== */

function getClassFromURL(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );


    const className =
      String(
        params.get('class') || ''
      ).trim();


    if(
      CLASSES.includes(
        className
      )
    ){

      return className;

    }


  }catch(error){

    console.error(
      '讀取網址參數失敗',
      error
    );

  }


  return '';

}



/* ==================================================
   從 liff.state 取得 class
================================================== */

function getClassFromLiffState(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );


    const state =
      params.get(
        'liff.state'
      );


    if(!state){

      return '';

    }


    /*
     * liff.state 可能長得像：
     *
     * /?class=一甲
     *
     * 或
     *
     * ?class=一甲
     */

    let decodedState =
      state;


    try{

      decodedState =
        decodeURIComponent(
          state
        );

    }catch(e){
      // 已經解碼就直接使用
    }


    const questionIndex =
      decodedState.indexOf('?');


    if(
      questionIndex === -1
    ){

      return '';

    }


    const queryString =
      decodedState.substring(
        questionIndex + 1
      );


    const stateParams =
      new URLSearchParams(
        queryString
      );


    const className =
      String(
        stateParams.get('class')
        || ''
      ).trim();


    if(
      CLASSES.includes(
        className
      )
    ){

      return className;

    }


  }catch(error){

    console.error(
      '讀取 liff.state 失敗：',
      error
    );

  }


  return '';

}



/* ==================================================
   找不到班級
================================================== */

function showNoClass(){

  document.getElementById(
    'classTitle'
  ).textContent =
    '找不到班級';


  document.getElementById(
    'students'
  ).innerHTML = `

    <div class="error">

      ⚠️ 這個 LINE 連結沒有帶入班級資料。

      <br><br>

      請從 LINE 官方帳號的
      「一甲～六甲」按鈕進入。

    </div>

  `;

}



/* ==================================================
   開啟按鈕
================================================== */

function enableButtons(){

  document.getElementById(
    'checkAllButton'
  ).disabled = false;


  document.getElementById(
    'saveButton'
  ).disabled = false;


  document.getElementById(
    'reloadButton'
  ).disabled = false;

}



/* ==================================================
   JSONP API
================================================== */

function api(
  action,
  params = {}
){

  return new Promise(
    (resolve,reject)=>{


      const callbackName =

        'attendanceCallback_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object
        .keys(params)
        .forEach(
          key => {

            if(
              params[key] !== undefined &&
              params[key] !== null
            ){

              query.set(
                key,
                String(
                  params[key]
                )
              );

            }

          }
        );


      let finished =
        false;


      const timer =
        setTimeout(
          ()=>{

            if(finished){
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                'Apps Script 連線逾時'
              )
            );

          },
          20000
        );



      function cleanup(){

        clearTimeout(
          timer
        );


        if(
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );

        }


        try{

          delete window[
            callbackName
          ];

        }catch(e){

          window[
            callbackName
          ] = undefined;

        }

      }



      window[
        callbackName
      ] = function(data){


        if(finished){
          return;
        }


        finished =
          true;


        cleanup();


        if(
          data &&
          data.ok === false
        ){

          reject(
            new Error(
              data.error ||
              'API 發生錯誤'
            )
          );

          return;

        }


        resolve(
          data
        );

      };



      script.onerror =
        function(){


          if(finished){
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              '無法連線到 Apps Script'
            )
          );

        };



      script.src =

        CONFIG.API_URL +

        '?' +

        query.toString();



      document.body
        .appendChild(
          script
        );

    }
  );

}



/* ==================================================
   讀取學生
================================================== */

async function loadStudents(){

  if(!currentClass){

    showNoClass();

    return;

  }


  const box =
    document.getElementById(
      'students'
    );


  box.innerHTML = `

    <div class="message">

      正在讀取
      ${escapeHTML(currentClass)}
      學生名單...

    </div>

  `;


  try{

    studentData =
      await api(
        'getStudents',
        {
          className:
            currentClass
        }
      );


    renderStudents();


  }catch(error){

    console.error(
      error
    );


    box.innerHTML = `

      <div class="error">

        ❌ 無法取得學生名單

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        請確認 Apps Script
        Web App 已正常部署。

      </div>

    `;

  }

}



/* ==================================================
   顯示學生
================================================== */

function renderStudents(){

  const box =
    document.getElementById(
      'students'
    );


  if(
    !Array.isArray(
      studentData
    ) ||
    studentData.length === 0
  ){

    box.innerHTML = `

      <div class="message">

        ${escapeHTML(
          currentClass
        )}

        目前沒有學生資料。

      </div>

    `;

    return;

  }


  box.innerHTML =
    '';


  studentData.forEach(
    (student,index)=>{


      const div =
        document.createElement(
          'div'
        );


      div.className =
        'student';


      div.innerHTML = `

        <div class="student-row">


          <div class="number">

            ${escapeHTML(
              student.number
            )}

          </div>


          <div class="name">

            ${escapeHTML(
              student.name
            )}

          </div>


          <div
            class="status"
            id="status-${index}"
          >

            出席

          </div>


          <button
            class="btn gray"
            onclick="toggleDetails(${index})"
          >

            假別／備註

          </button>


        </div>


        <div
          class="details"
          id="details-${index}"
        >


          <select
            id="leave-${index}"
            onchange="leaveChanged(${index})"
          >

            <option value="">
              出席
            </option>

            <option value="事假">
              事假
            </option>

            <option value="病假">
              病假
            </option>

            <option value="喪假">
              喪假
            </option>

          </select>


          <button
            class="btn gray"
            onclick="setPresent(${index})"
          >

            恢復出席

          </button>


          <textarea
            id="note-${index}"
            placeholder="備註（可留白）"
          ></textarea>


        </div>

      `;


      box.appendChild(
        div
      );

    }
  );

}



/* ==================================================
   展開假別
================================================== */

function toggleDetails(index){

  const element =
    document.getElementById(
      'details-' + index
    );


  if(element){

    element
      .classList
      .toggle(
        'show'
      );

  }

}



/* ==================================================
   假別改變
================================================== */

function leaveChanged(index){

  const leave =
    document.getElementById(
      'leave-' + index
    ).value;


  const status =
    document.getElementById(
      'status-' + index
    );


  if(leave){

    status.textContent =
      '缺席';


    status.className =
      'status absent';

  }else{

    setPresent(
      index
    );

  }

}



/* ==================================================
   恢復出席
================================================== */

function setPresent(index){

  const select =
    document.getElementById(
      'leave-' + index
    );


  if(select){

    select.value =
      '';

  }


  const status =
    document.getElementById(
      'status-' + index
    );


  if(status){

    status.textContent =
      '出席';


    status.className =
      'status';

  }

}



/* ==================================================
   一鍵全班簽到
================================================== */

function checkAll(){

  if(
    !studentData.length
  ){

    return;

  }


  studentData.forEach(
    (student,index)=>{

      setPresent(
        index
      );

    }
  );


  document.getElementById(
    'saveStatus'
  ).textContent =

    '✓ 已將全班設定為出席，記得按「儲存今日出缺席」。';

}



/* ==================================================
   儲存
================================================== */

async function saveAttendance(){

  if(
    !currentClass ||
    !studentData.length
  ){

    alert(
      '目前沒有可以儲存的學生資料。'
    );

    return;

  }


  const button =
    document.getElementById(
      'saveButton'
    );


  const statusBox =
    document.getElementById(
      'saveStatus'
    );


  const records =
    studentData.map(
      (student,index)=>{


        const leaveElement =
          document.getElementById(
            'leave-' + index
          );


        const noteElement =
          document.getElementById(
            'note-' + index
          );


        const leave =
          leaveElement
            ? leaveElement.value
            : '';


        const note =
          noteElement
            ? noteElement.value.trim()
            : '';


        return {

          number:
            student.number,

          name:
            student.name,

          status:
            leave
              ? '缺席'
              : '出席',

          leaveType:
            leave,

          note:
            note

        };

      }
    );


  button.disabled =
    true;


  button.textContent =
    '儲存中...';


  statusBox.textContent =
    '正在儲存點名資料...';


  try{

    const result =
      await api(
        'saveAttendance',
        {

          className:
            currentClass,

          records:
            JSON.stringify(
              records
            )

        }
      );


    statusBox.textContent =

      '✅ ' +
      result.className +
      ' 今日點名完成，共 ' +
      result.count +
      ' 人。';


    alert(
      result.className +
      ' 今日點名完成！'
    );


  }catch(error){

    console.error(
      error
    );


    statusBox.textContent =
      '❌ 儲存失敗';


    alert(
      '儲存失敗：' +
      error.message
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      '💾 儲存今日出缺席';

  }

}



/* ==================================================
   HTML 安全處理
================================================== */

function escapeHTML(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    char => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char])
  );

}



/* ==================================================
   ★ 最後才啟動系統
================================================== */

startApp();

</script>

</body>
</html>
