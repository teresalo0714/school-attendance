<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校園出缺席管理系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--green:#06c755;--bg:#f3f6f7;--text:#17202a;--muted:#667085;--card:#fff;--red:#d92d20;--yellow:#f79009}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{background:var(--green);color:white;padding:18px 16px}header h1{margin:0;font-size:21px}header p{margin:5px 0 0;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-weight:700;margin:10px 0 6px}
select,input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:white;font:inherit}
button{border:0;border-radius:10px;padding:11px 13px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#eef2f3}.danger{background:#fee4e2;color:var(--red)}.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.active{background:var(--green);color:white}
.student{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.student:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#dcfae6;color:#067647}.absent{background:#fee4e2;color:#b42318}.leave{background:#fff3cd;color:#b54708}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}.num{font-size:22px;font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17202a;color:white;padding:10px 16px;border-radius:999px;display:none;z-index:10}
</style>
</head>
<body>
<header><h1>🏫 校園出缺席管理系統</h1><p id="lineUser">LINE 點名系統</p></header>
<main>
<div class="tabs">
<button id="teacherBtn" class="active" onclick="page('teacher')">👩‍🏫 老師點名</button>
<button id="adminBtn" onclick="page('admin')">🔐 行政管理</button>
</div>

<section id="teacher">
<div class="card">
<h2>今日點名</h2>
<label>日期</label><input id="date" type="date">
<label>班級</label><select id="class"></select>
<div class="row" style="margin-top:12px"><button class="primary" onclick="allPresent()">🟢 全班到校</button><button class="secondary" onclick="render()">重新整理</button></div>
</div>
<div class="card"><h2>學生</h2><div id="students"></div></div>
<div class="card">
<h2>📝 登記請假</h2>
<label>學生姓名</label><select id="leaveStudent" onchange="showLeave()"><option value="">請先選學生</option></select>
<div id="leaveBox" class="hidden">
<label>請假日期</label><input id="leaveDate" type="date">
<label>開始時間</label><input id="start" type="time">
<label>結束時間</label><input id="end" type="time">
<label>請假類型</label><select id="type"><option>事假</option><option>病假</option><option>公假</option><option>其他</option></select>
<button class="primary full" style="margin-top:12px" onclick="saveLeave()">儲存請假</button>
</div>
</div>
</section>

<section id="admin" class="hidden">
<div id="login" class="card"><h2>🔐 行政管理</h2><input id="pw" type="password" placeholder="行政密碼"><button class="primary full" style="margin-top:12px" onclick="login()">登入</button></div>
<div id="dash" class="hidden">
<div class="card"><h2>全校今日統計</h2><label>日期</label><input id="adminDate" type="date"><div id="stats" class="stat" style="margin-top:10px"></div></div>
<div class="card"><h2>各班統計</h2><div id="classes"></div></div>
<div class="card"><h2>缺席／請假名單</h2><div id="list"></div></div>
<div class="card"><button class="secondary full" onclick="csv()">⬇️ 匯出 CSV</button><button class="danger full" style="margin-top:8px" onclick="logout()">登出</button></div>
</div>
</section>
</main>
<div id="toast" class="toast"></div>

<script>
const LIFF_ID="2011500404-mlhsA2fA"; // 建立 LIFF 後把 LIFF ID 填在這裡
const ADMIN_PASSWORD="sdes6320902";
const R={
"一甲":["梅淨林","陳翊","黃恩泉","蔡士宗","徐浚愷","洪祟祐","張景文","江昀芝","王秝家","周婉琦","莊毓儒"],
"二甲":["高瑞翌","鄭垚庠","洪宥昇","盧成風","余守豐","張晨恩","方星棠","許嘉恩","許郁欣","黃茹渝","陳欣","汪萭霏","歐柔安","徐柔安"],
"三甲":["張惟歆","楊承宥","徐浚晏","蕭妤晅","黃毓沁","王婕庭","洪苡恩","劉以軍","張芸菲","張鉦坪"],
"四甲":["黃予安","洪翊軒","王俊堡","盧廷州","洪翌程","張詠恩","吳虹翾","謝媃崴","洪欣瑜","吳宥瑩","余昕庭","黃姿穎"],
"五甲":["謝恩典","謝侑廷","張恆睿","江柏佑","陳永木","余亭叡","許瑋庭","江旻瑾","蕭妡紜","張羽希","吳芃蓁","張蕎音","林文彬","陳明賢"],
"六甲":["黃琮益","黃琮傑","黃裕宬","高芳慈","劉貝倪","沈柏逸","鄭明源","廖文皓","陳芃崴","洪立芹","江旻珆","余菀庭","余芷嫻","余昀芯"]};
let data=JSON.parse(localStorage.getItem("attendance")||"[]");
const today=()=>new Date().toISOString().slice(0,10);
const key=(d,c,n)=>d+"|"+c+"|"+n;
function save(){localStorage.setItem("attendance",JSON.stringify(data))}
function find(d,c,n){return data.find(x=>x.key===key(d,c,n))}
function put(x){data=data.filter(y=>y.key!==x.key);data.push(x);save()}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function init(){
date.value=today();leaveDate.value=today();adminDate.value=today();
Object.keys(R).forEach(c=>document.getElementById("class").add(new Option(c,c)));
render();
if(LIFF_ID && window.liff){liff.init({liffId:LIFF_ID}).then(()=>{if(!liff.isLoggedIn())liff.login();else liff.getProfile().then(p=>lineUser.textContent="LINE："+p.displayName)}).catch(console.error)}
}
function render(){
let c=document.getElementById("class").value,d=date.value,s=document.getElementById("students"),ls=document.getElementById("leaveStudent");
s.innerHTML="";ls.innerHTML='<option value="">請先選學生</option>';
R[c].forEach(n=>{let x=find(d,c,n),st=x?.status||"未點名",cl=st==="到校"?"ok":st==="缺席"?"absent":st==="請假"?"leave":"";
s.innerHTML+=`<div class="student"><div><b>${n}</b><div class="muted">${x?.note||""}</div></div><div><span class="badge ${cl}">${st}</span> <button class="secondary" onclick="setSt('${n}','到校')">到校</button> <button class="danger" onclick="setSt('${n}','缺席')">缺席</button></div></div>`;
ls.add(new Option(n,n))})
}
function setSt(n,st){let d=date.value,c=document.getElementById("class").value;put({key:key(d,c,n),date:d,className:c,name:n,status:st,time:new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}),note:""});render();toast(n+"："+st)}
function allPresent(){let d=date.value,c=document.getElementById("class").value;R[c].forEach(n=>put({key:key(d,c,n),date:d,className:c,name:n,status:"到校",time:new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}),note:""}));render();toast(c+" 全班到校")}
function showLeave(){leaveBox.classList.toggle("hidden",!leaveStudent.value)}
function saveLeave(){let n=leaveStudent.value,d=leaveDate.value,c=document.getElementById("class").value;if(!n||!d){toast("請選學生與日期");return}let st=start.value,en=end.value,t=type.value;put({key:key(d,c,n),date:d,className:c,name:n,status:"請假",time:st,note:t+(st||en?"｜"+st+"-"+en:"")});render();leaveStudent.value="";showLeave();toast("請假已儲存")}
function page(p){teacher.classList.toggle("hidden",p!=="teacher");admin.classList.toggle("hidden",p!=="admin");teacherBtn.classList.toggle("active",p==="teacher");adminBtn.classList.toggle("active",p==="admin")}
function login(){if(pw.value!==ADMIN_PASSWORD){toast("密碼錯誤");return}login.classList.add("hidden");dash.classList.remove("hidden");dashboard()}
function logout(){dash.classList.add("hidden");login.classList.remove("hidden");pw.value=""}
function dashboard(){
let d=adminDate.value,day=data.filter(x=>x.date===d),p=day.filter(x=>x.status==="到校").length,a=day.filter(x=>x.status==="缺席").length,l=day.filter(x=>x.status==="請假").length;
stats.innerHTML=`<div><div class="num">${p}</div>到校</div><div><div class="num">${a}</div>缺席</div><div><div class="num">${l}</div>請假</div>`;
classes.innerHTML=Object.entries(R).map(([c,arr])=>{let z=day.filter(x=>x.className===c);return `<div class="card" style="box-shadow:none;background:#f8fafc"><b>${c}</b><div class="muted">應到 ${arr.length}　到校 ${z.filter(x=>x.status==="到校").length}　缺席 ${z.filter(x=>x.status==="缺席").length}　請假 ${z.filter(x=>x.status==="請假").length}</div></div>`}).join("");
list.innerHTML=day.filter(x=>x.status!=="到校").map(x=>`<div class="student"><b>${x.className}｜${x.name}</b><span class="badge ${x.status==="請假"?"leave":"absent"}">${x.status}</span></div>`).join("")||'<p class="muted">沒有缺席／請假紀錄。</p>';
}
adminDate.addEventListener("change",dashboard);
function csv(){let t="日期,班級,學生,狀態,時間,備註\n"+data.map(x=>[x.date,x.className,x.name,x.status,x.time,x.note].map(v=>`"${String(v||"").replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="出缺席紀錄.csv";a.click()}
init();
</script>
</body>
</html>
