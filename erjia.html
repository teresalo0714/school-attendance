<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園出缺席管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6ff;color:#25324b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.header{background:#6f84df;color:#fff;padding:24px 18px 28px}.header h1{margin:0;font-size:30px}.wrap{max-width:900px;margin:-10px auto 40px;padding:0 14px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(50,70,120,.12);margin-bottom:16px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:800;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #dfe4f0;border-radius:12px;background:#fff;color:#25324b}.fixed{background:#f2f4fa!important;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{padding:12px 16px;border-radius:12px;font-weight:800}.green{background:#43b581;color:#fff}.blue{background:#6f84df;color:#fff}.orange{background:#f1a64b;color:#fff}.gray{background:#edf0f6;color:#53617d}.notice{margin-top:14px;background:#f3f5fd;border-radius:14px;padding:13px;color:#596783;line-height:1.55}.student-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.student{border:1px solid #e1e6f0;border-radius:14px;padding:12px}.student.present{background:#f0fbf5;border-color:#a8ddc2}.student.leave{background:#fff8ed;border-color:#f0ca8a}.student-name{font-weight:900;font-size:17px}.status{margin-top:5px;color:#69758d;font-size:13px;min-height:20px}.student-actions{display:flex;gap:7px;margin-top:9px}.student-actions button{flex:1;padding:8px;border-radius:9px;font-weight:800}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(20,28,48,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f6f8fc;border:1px solid #e2e6ef;border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.tablewrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 7px;border-bottom:1px solid #e4e8f0;text-align:left;white-space:nowrap}th{background:#f5f7fb}.empty{padding:20px;text-align:center;color:#77829a}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry-btn{display:block;width:100%;padding:18px;border-radius:16px;background:#6f84df;color:#fff;font-size:20px;font-weight:900;text-align:center;text-decoration:none}.entry-admin{background:#53617d;margin-top:12px}@media(max-width:620px){.grid,.entry-grid{grid-template-columns:1fr}.student-list{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.header h1{font-size:27px}}</style></head><body><header class="header"><h1>校園出缺席管理</h1></header><main class="wrap"><div class="card"><div class="tabs"><button id="teacherTab" class="tab btn blue">👩‍🏫 教師點名</button><button id="adminTab" class="tab btn gray">🧑‍💼 行政端</button></div><section id="teacherPanel"><div class="grid"><div><label>日期</label><input id="date" type="date"></div><div><label>班級</label><input id="fixedClass" class="fixed" readonly></div></div><div class="actions"><button id="wholeBtn" class="btn green">✓ 全班到</button><button id="clearBtn" class="btn gray">↺ 清除本次點名</button><button id="saveBtn" class="btn blue">💾 儲存本次點名</button></div><div id="message" class="notice">請先確認日期，再為學生登記「到」或「假」。</div><h2 id="studentTitle">學生名單</h2><div id="studentList" class="student-list"></div></section><section id="adminPanel" class="hidden"><div id="loginBox"><h2>行政端</h2><div class="notice">請輸入行政端密碼。</div><input id="adminPassword" type="password" placeholder="行政端密碼"><div class="actions"><button id="loginBtn" class="btn blue">登入</button></div><div id="loginError"></div></div><div id="adminContent" class="hidden"><div class="grid"><div><label>統計日期</label><input id="adminDate" type="date"></div><div><label>班級</label><select id="adminClass"><option value="">全校</option></select></div></div><div class="actions"><button id="refreshBtn" class="btn blue">重新整理</button><button id="csvBtn" class="btn gray">匯出 CSV</button></div><div class="stats"><div class="stat">學生總數<b id="statTotal">0</b></div><div class="stat">出席<b id="statPresent">0</b></div><div class="stat">請假<b id="statLeave">0</b></div></div><h3>各班統計</h3><div id="classStats" class="tablewrap"></div><h3>請假名單</h3><div id="leaveTable" class="tablewrap"></div></div></section></div></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>const LIFF_ID="2011500404-mlhsA2fA";const CLOUD_API_URL="https://script.google.com/macros/s/AKfycbzlJJ3CC9VW0EmOnszeR6tcGzp3QGxNpbG4t_XXaLC1PRg8vb2abe7Zxr0K6_fhH_H9/exec";const R={"一甲": ["梅淨林", "陳翊", "黃恩泉", "蔡士宗", "徐浚愷", "洪祟祐", "張景文", "江昀芝", "王秝家", "周婉琦", "莊毓儒"], "二甲": ["高瑞翌", "鄭垚庠", "洪宥昇", "盧成風", "余守豐", "張晨恩", "方星棠", "許嘉恩", "許郁欣", "黃茹渝", "陳欣", "汪萭霏", "歐柔安", "徐柔安"], "三甲": ["張惟歆", "楊承宥", "徐浚晏", "蕭妤晅", "黃毓沁", "王婕庭", "洪苡恩", "劉以軍", "張芸菲", "張鉦坪"], "四甲": ["黃予安", "洪翊軒", "王俊堡", "盧廷州", "洪翌程", "張詠恩", "吳虹翾", "謝媃崴", "洪欣瑜", "吳宥瑩", "余昕庭", "黃姿穎"], "五甲": ["謝恩典", "謝侑廷", "張恆睿", "江柏佑", "陳永木", "余亭叡", "許瑋庭", "江旻瑾", "蕭妡紜", "張羽希", "吳芃蓁", "張蕎音", "林文彬", "陳明賢"], "六甲": ["黃琮益", "黃琮傑", "黃裕宬", "高芳慈", "劉貝倪", "沈柏逸", "鄭明源", "廖文皓", "陳芃崴", "洪立芹", "江旻珆", "余菀庭", "余芷嫻", "余昀芯"]};const FIXED_CLASS="二甲";const ADMIN_PASSWORD="請在這裡設定行政端密碼";
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function loadCloud(){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);window[cb]=x=>{delete window[cb];s.remove();resolve(Array.isArray(x?.records)?x.records:[])};const s=document.createElement("script");s.src=CLOUD_API_URL+"?action=records&callback="+cb;s.onerror=()=>{delete window[cb];s.remove();reject(new Error("read failed"))};document.body.append(s);setTimeout(()=>{if(window[cb]){delete window[cb];s.remove();reject(new Error("timeout"))}},12000);});}

let marks={},saving=false;
function renderStudents(){const roster=R[FIXED_CLASS]||[];$("studentTitle").textContent=FIXED_CLASS+"｜學生名單（"+roster.length+"人）";const box=$("studentList");box.innerHTML="";roster.forEach(name=>{const m=marks[name],d=document.createElement("div");d.className="student "+(m?.status||"");d.innerHTML="<div class='student-name'></div><div class='status'></div><div class='student-actions'><button class='green'>到</button><button class='orange'>假</button></div>";d.querySelector(".student-name").textContent=name;d.querySelector(".status").textContent=m?.status==="present"?"✓ 出席":m?.status==="leave"?"假｜"+(m.leaveType||"")+(m.note?"｜"+m.note:""):"尚未點名";d.querySelectorAll("button")[0].onclick=()=>{marks[name]={status:"present"};renderStudents()};d.querySelectorAll("button")[1].onclick=()=>openLeave(name);box.append(d);});}
function markWhole(){marks={};(R[FIXED_CLASS]||[]).forEach(n=>marks[n]={status:"present"});renderStudents();$("message").textContent=FIXED_CLASS+" 已全部標記為出席，共 "+Object.keys(marks).length+" 人。請按「儲存本次點名」。";}
function clearCurrent(){marks={};renderStudents();$("message").textContent="本次點名已清除。";}
function openLeave(name){const m=document.createElement("div");m.className="modal";m.innerHTML='<div class="modalbox"><h3>📝 登記請假</h3><label>學生</label><input id="ls" readonly><label style="margin-top:10px">請假日期</label><input id="ld" type="date"><label style="margin-top:10px">請假類型</label><select id="lt"><option>病假</option><option>事假</option><option>喪假</option></select><label style="margin-top:10px">備註</label><input id="ln" placeholder="可填寫備註"><div class="actions"><button id="lok" class="btn orange">儲存請假</button><button id="lno" class="btn gray">取消</button></div></div>';document.body.append(m);$("ls").value=name;$("ld").value=$("date").value||today();$("lok").onclick=()=>{marks[name]={status:"leave",leaveType:$("lt").value,leaveDate:$("ld").value,note:$("ln").value.trim()};m.remove();renderStudents()};$("lno").onclick=()=>m.remove();}
async function sendBatch(batch){const payload={action:"saveBatch",batchId:Date.now()+"_"+Math.random().toString(36).slice(2),date:batch[0].date,className:batch[0].class,records:batch.map(r=>({name:r.name,status:r.status,leaveType:r.leaveType,leaveDate:r.leaveDate,note:r.note}))};await fetch(CLOUD_API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true});}
async function saveCurrent(){if(saving)return;const d=$("date").value,c=FIXED_CLASS,roster=R[c]||[];if(!d)return alert("請先選擇日期。");const missing=roster.filter(n=>!marks[n]);if(missing.length)return alert("還有 "+missing.length+" 位學生尚未點名：\n"+missing.join("、"));const batch=roster.map(name=>{const m=marks[name];return{date:d,class:c,name,status:m.status,leaveType:m.leaveType||"",leaveDate:m.leaveDate||"",note:m.note||""}});saving=true;$("saveBtn").disabled=true;$("wholeBtn").disabled=true;$("message").textContent="正在儲存 "+batch.length+" 人…";try{await sendBatch(batch);marks={};renderStudents();$("message").textContent="儲存完成！";alert("儲存完成！\n"+c+" 共 "+batch.length+" 人。")}catch(e){$("message").textContent="雲端儲存失敗。";alert("雲端儲存失敗，請檢查 Apps Script。")}finally{saving=false;$("saveBtn").disabled=false;$("wholeBtn").disabled=false;}}
let adminLoggedIn=false,cloudCache=[];function showTeacher(){$("teacherPanel").classList.remove("hidden");$("adminPanel").classList.add("hidden")}function showAdmin(){$("teacherPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden")}function login(){if($("adminPassword").value===ADMIN_PASSWORD){adminLoggedIn=true;$("loginBox").classList.add("hidden");$("adminContent").classList.remove("hidden");renderAdmin()}else $("loginError").textContent="密碼錯誤。"}function renderAdmin(){loadCloud().then(rows=>{cloudCache=rows;const d=$("adminDate").value,c=$("adminClass").value,f=rows.filter(r=>(!d||r.date===d)&&(!c||r.class===c));$("statPresent").textContent=f.filter(r=>r.status==="present").length;$("statLeave").textContent=f.filter(r=>r.status==="leave").length;$("statTotal").textContent=(c?R[c].length:Object.values(R).reduce((a,v)=>a+v.length,0));$("classStats").innerHTML="<div class='empty'>雲端資料已更新。</div>";$("leaveTable").innerHTML=f.filter(r=>r.status==="leave").map(r=>r.date+"｜"+r.class+"｜"+r.name+"｜"+r.leaveType+"｜"+r.note).join("<br>")||"<div class='empty'>目前沒有請假資料。</div>"}).catch(()=>$("classStats").innerHTML="<div class='empty'>雲端讀取失敗。</div>")}function csv(){const out=cloudCache.map(r=>[r.date,r.class,r.name,r.status,r.leaveType,r.leaveDate,r.note].join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["日期,班級,學生姓名,狀態,假別,請假日期,備註\n"+out],{type:"text/csv"}));a.download="出缺席.csv";a.click()}function init(){$("date").value=today();$("adminDate").value=today();$("fixedClass").value=FIXED_CLASS;Object.keys(R).forEach(c=>$("adminClass").append(new Option(c,c)));$("teacherTab").onclick=showTeacher;$("adminTab").onclick=showAdmin;$("wholeBtn").onclick=markWhole;$("clearBtn").onclick=clearCurrent;$("saveBtn").onclick=saveCurrent;$("loginBtn").onclick=login;$("refreshBtn").onclick=renderAdmin;$("csvBtn").onclick=csv;renderStudents()}async function start(){init();try{await liff.init({liffId:LIFF_ID})}catch(e){console.warn(e)}}start();</script></body></html>
